<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>勇者地牢 · 第5课 · 队列与撤销</title>
<link rel="icon" href="../favicon.svg" />
<style>
:root{--bg:#0e1624;--elev:#16263d;--surface:#1c2d48;--cream:#f4efe6;--dim:#c9c2b4;--coral:#e8624d;--ink:#0e1624;--border:rgba(244,239,230,.14)}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:var(--bg);color:var(--cream);font-family:"IBM Plex Sans","Noto Sans SC",system-ui,sans-serif}
button:not(:disabled){cursor:pointer}.wrap{max-width:960px;margin:0 auto;padding:24px 16px 48px}
.kicker{font-size:11px;letter-spacing:.2em;color:var(--dim)}h1,h2{font-family:"Noto Serif SC","Songti SC",serif;font-weight:600;margin:8px 0 0}h1{font-size:clamp(28px,5vw,44px);line-height:1.15}h2{font-size:26px}
.muted{color:var(--dim);line-height:1.65}.grid2{display:grid;gap:12px;margin:24px 0}@media(min-width:640px){.grid2{grid-template-columns:1fr 1fr}}
.card{border:1px solid var(--border);background:rgba(22,38,61,.86);border-radius:20px;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin-top:24px}
.btn{height:44px;border-radius:999px;border:0;padding:0 20px;font-size:14px;font-weight:500}.btn-p{background:var(--cream);color:var(--ink)}.btn-g{background:transparent;color:var(--cream);border:1px solid var(--border)}.btn:disabled{background:var(--surface);color:var(--dim);cursor:not-allowed}
.hud{display:flex;flex-wrap:wrap;justify-content:space-between;gap:16px;align-items:end}.bars{display:grid;grid-template-columns:1fr 1fr;gap:10px;width:min(100%,320px)}
.barbox{border:1px solid var(--border);background:rgba(22,38,61,.85);border-radius:16px;padding:8px 10px}.barbox .t{display:flex;justify-content:space-between;font-size:11px;color:var(--dim)}
.bar{height:6px;background:var(--surface);border-radius:99px;margin-top:6px;overflow:hidden}.bar>i{display:block;height:100%;border-radius:99px;background:var(--cream);width:0;transition:width .25s}.bar.danger>i{background:var(--coral)}
.arena{display:flex;justify-content:space-between;align-items:end;min-height:180px;padding:12px 8px}.portrait{width:132px;height:132px;border-radius:50%;overflow:hidden;border:1px solid var(--border);background:var(--elev)}.portrait img{width:100%;height:100%;object-fit:cover;object-position:50% 18%}
.queue{display:flex;gap:10px;overflow-x:auto;min-height:110px}.ticket{min-width:148px;flex:1;border-radius:18px;border:1px solid var(--border);background:var(--surface);color:var(--dim);padding:12px 14px;text-align:left}.ticket.front{background:var(--cream);color:var(--ink);border-color:var(--cream)}.ticket small{display:block;font-size:11px;opacity:.7}.ticket b{display:block;margin-top:6px;font-family:"Noto Serif SC",serif;font-size:18px;font-weight:600}
.stack{display:flex;flex-direction:column-reverse;gap:8px;min-height:180px}
.flash{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);width:min(36rem,calc(100% - 2rem));background:rgba(22,38,61,.96);border:1px solid var(--border);border-radius:20px;padding:12px 16px;text-align:center;font-size:14px;pointer-events:none}
a{color:var(--dim)}.shake{animation:shake .36s}@keyframes shake{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
</style></head><body><div class="wrap" id="app"></div>
<script>
const ADA="../assets/sprites/hero.png";const GOB="../assets/sprites/goblin.png";
const EVENTS=[{id:"guard",title:"格挡",kind:"guard"},{id:"smash",title:"哥布林重击",kind:"smash"},{id:"slash",title:"反击一剑",kind:"slash"}];
const ACTS=[{id:"slash",title:"挥剑"},{id:"potion",title:"喝药"},{id:"map",title:"翻图"}];
const S={screen:"boot",ada:80,gob:40,adaMax:80,gobMax:40,queue:[],arrived:0,blocked:false,stagger:false,log:"战场安静。事件会从右边进队。",flash:"",stack:[],done:{},goal:"play",shake:false};
function say(t){S.log=t;S.flash=t;render();clearTimeout(say._t);say._t=setTimeout(()=>{S.flash="";render();},2200)}
function hp(label,v,max,danger){const pct=Math.max(0,Math.min(100,(v/max)*100));return `<div class="barbox"><div class="t"><span>${label}</span><span>${v}/${max}</span></div><div class="bar ${danger?"danger":""}"><i style="width:${pct}%"></i></div></div>`}
function arena(){return `<div class="arena"><div class="portrait"><img src="${ADA}" alt="Ada"></div><div class="portrait"><img src="${GOB}" alt="哥布林"></div></div>`}
function hud(kicker,title){return `<div class="hud"><div><p class="kicker">${kicker}</p><h2>${title}</h2></div><div class="bars">${hp("Ada",S.ada,S.adaMax)}${hp("哥布林",S.gob,S.gobMax,true)}</div></div>`}
function boot(){return `<p class="kicker">HERODUNGEON · 第 5 次课</p><h1>队列先到先走<br>撤销后进先出</h1><p class="muted" style="max-width:36rem;margin-top:16px">先让战场事件按到达顺序结算，再把喝错的药从栈顶撤回去。栈只弹出动作票，血量由世界改。</p><div class="grid2"><div class="card"><b>第一关 · 事件队列</b><p class="muted">只能处理队首。从中间挖，不是队列。</p></div><div class="card"><b>第二关 · 撤销栈</b><p class="muted">后进先出。喝错药，得先把后来的票撤掉。</p></div></div><div class="row"><button class="btn btn-p" data-act="start">开始试玩</button><a href="how-to.html">玩法说明 · 第5课</a><a href="../">返回第1课迷宫</a></div>`}
function enqueueTick(){if(S.screen!=="stage1"||S.arrived>=EVENTS.length)return;S.queue.push({...EVENTS[S.arrived]});S.arrived+=1;say("进队（队尾）："+S.queue[S.queue.length-1].title);if(S.arrived<EVENTS.length)setTimeout(enqueueTick,700)}
function apply(ev){if(ev.kind==="guard"){S.blocked=true;say("格挡成功。下一击会打在盾上。");return"ok"}if(ev.kind==="smash"){if(S.blocked){S.stagger=true;say("重击打在盾上。哥布林破绻。");return"ok"}S.ada=0;say("没有格挡。重击把你打穿了。");return"fail"}if(S.stagger){S.gob=0;say("反击命中。哥布林倒下。");return"win"}S.ada=0;say("哥布林没有破绻。你空挥一剑，被反击打倒。");return"fail"}
function processFront(){if(!S.queue.length){say("队列是空的。先等事件进队。");return}const ev=S.queue.shift();const r=apply(ev);if(r==="fail")setTimeout(()=>{S.screen="fail";render()},700);if(r==="win")setTimeout(()=>{S.screen="win1";render()},700);render()}
function clickCard(i){if(i!==0){S.shake=true;say("队列只出队首。从中间挖，是 O(n) 的乱序，不是队列。");setTimeout(()=>{S.shake=false;render()},360);return}processFront()}
function playAnti(){S.queue=EVENTS.map(e=>({...e}));S.arrived=3;S.blocked=false;S.stagger=false;S.ada=80;S.gob=40;say("反例：从队尾往前挖。看血条。");const order=[...EVENTS].reverse();order.forEach((ev,i)=>{setTimeout(()=>{say("乱序结算："+ev.title);if(ev.kind==="smash")S.ada=0;if(i===order.length-1)setTimeout(()=>{S.screen="fail";render()},500);render()},700*(i+1))});render()}
function stage1(){const tickets=S.queue.length?S.queue.map((ev,i)=>`<button class="ticket ${i===0?"front":""}" data-card="${i}"><small>${i===0?"队首 · 点我结算":"第 "+(i+1)+" 件"}</small><b>${ev.title}</b></button>`).join(""):`<p class="muted" style="align-self:center">队列空。事件正从右边进来。</p>`;return `${hud("第一关 · FIFO 事件队列","只能处理最先到达的那一件")}${arena()}<section class="card" style="margin-top:12px"><div style="display:flex;justify-content:space-between;font-size:12px;color:var(--dim)"><span>EVENT QUEUE · 左 = 队首</span><span>len ${S.queue.length}</span></div><div class="queue" style="margin-top:10px">${tickets}</div><div class="row"><button class="btn btn-p" data-act="front">处理队首</button><button class="btn btn-g" data-act="anti">看反例：从队尾乱挖</button></div></section><p class="muted" style="margin-top:14px">${S.log}</p>`}
function fail(){return `<p class="kicker" style="color:var(--coral)">FAILED · 顺序错了</p><h2>后发生的事被提前结算</h2><p class="muted">格挡还在队里，重击却先落地。这就是把队列当成栈来弹。</p><div class="row"><button class="btn btn-p" data-act="retry1">按队列再来一次</button></div>`}
function win1(){return `<p class="kicker">CLEARED · FIFO</p><h2>先到先走，盾才来得及</h2><p class="muted">你按队首弹出了：格挡 → 重击 → 反击。同一组事件若从队尾挖，你会先空挥，再被打穿。</p><div class="card muted" style="margin-top:16px">记住：<b style="color:var(--cream)">队列一端进、一端出。</b> 从中间点一张牌，不是 EventQueue。</div><div class="row"><button class="btn btn-p" data-act="to2">下一关 · 撤销</button><button class="btn btn-g" data-act="retry1">重打第一关</button></div>`}
function reset1(){S.screen="stage1";S.ada=80;S.gob=40;S.adaMax=80;S.gobMax=40;S.queue=[];S.arrived=0;S.blocked=false;S.stagger=false;S.log="战场安静。事件会从右边进队。";render();setTimeout(enqueueTick,500)}
function perform(id){if(S.goal!=="play"||S.done[id])return;const act=ACTS.find(a=>a.id===id);S.stack.push(act);S.done[id]=true;if(id==="slash"){S.gob=0;say("挥剑。哥布林倒下。栈顶多了一张『挥剑』票。世界改了血，栈没有存血。")}if(id==="potion"){S.ada+=20;say("喝药。Ada 50→70。票进栈。栈不知道 70 这个数字。")}if(id==="map")say("翻图。不改血量，只留下一张票在栈顶。");if(S.done.slash&&S.done.potion&&S.done.map){S.goal="undo";say("药要留给 Boss。按撤销。栈只能弹栈顶——先翻图，再喝药。")}render()}
function undo(){if(!S.stack.length){say("栈是空的。");return}const popped=S.stack.pop();if(popped.id==="potion"){S.ada-=20;say("弹出『喝药』。世界把血从 70 扣回 50。栈自己不改 HP。")}else if(popped.id==="map")say("弹出『翻图』。血量没动——这张票本来就不碰世界。");else{S.gob=40;say("弹出『挥剑』。剑伤被世界收回。通常你不该撤到这里。")}const potionGone=!S.stack.some(t=>t.id==="potion");const swordKept=S.stack.some(t=>t.id==="slash");if(potionGone&&swordKept)setTimeout(()=>{S.screen="clear";render()},900);render()}
function clickTicket(i){if(i!==S.stack.length-1){S.shake=true;say("栈只能弹栈顶。想撤喝药，得先把压在上面的票拿掉。");setTimeout(()=>{S.shake=false;render()},360);return}undo()}
function stage2(){const tickets=S.stack.length?S.stack.map((t,i)=>{const top=i===S.stack.length-1;return `<button class="ticket ${top?"front":""}" data-stk="${i}"><small>${top?"栈顶":"压在下面"}</small><b>${t.title}</b></button>`}).join(""):`<p class="muted">空栈</p>`;const acts=ACTS.map(a=>`<button class="btn btn-p" data-do="${a.id}" ${S.done[a.id]||S.goal!=="play"?"disabled":""}>${a.title}</button>`).join("");return `${hud("第二关 · LIFO 撤销栈",S.goal==="play"?"先做三件事，再按撤销":"药喝错了。只能从栈顶往下撤")}${arena()}<div style="display:grid;gap:12px;margin-top:12px" class="grid2"><section class="card"><p class="kicker">世界 · 血量在这里，不在栈里</p><div class="row">${acts}<button class="btn btn-g" data-act="undo">撤销 · Z</button></div><p class="muted" style="margin-top:12px">${S.goal==="play"?"顺序任意，三件都做完。喝药会把血从 50 加到 70。":"栈顶是最后做的那件。点下面不是栈顶的票，会被拒绝。"}</p></section><aside class="card"><p class="kicker">UNDO STACK · 上 = 栈顶</p><div class="stack">${tickets}</div></aside></div>`}
function clearView(){return `<p class="kicker">ESCAPED · 第 5 课通关</p><h2>带走这三句话去写作业</h2><div class="card" style="margin-top:16px"><b>队列</b><p class="muted">先到先走。格挡必须在重击之前出队。</p></div><div class="card" style="margin-top:10px"><b>栈</b><p class="muted">后进先出。喝错药，先把压在上面的票撤掉。</p></div><div class="card" style="margin-top:10px"><b>职责</b><p class="muted">栈只记动作票，不存血量。扣血、回血是世界干的。</p></div><p class="muted" style="margin-top:16px">仓库今晚只改 stack.py。课件里的 do/undo 对照仓库的 push/pop。空栈要抛错，不要返回 None。</p><div class="row"><button class="btn btn-p" data-act="reboot">再玩一遍</button><a href="../">返回第1课迷宫</a></div>`}
function view(){if(S.screen==="boot")return boot();if(S.screen==="stage1")return stage1();if(S.screen==="fail")return fail();if(S.screen==="win1")return win1();if(S.screen==="stage2")return stage2();return clearView()}
function render(){const app=document.getElementById("app");app.className="wrap"+(S.shake?" shake":"");app.innerHTML=view()+(S.flash?`<div class="flash">${S.flash}</div>`:"")}
document.getElementById("app").addEventListener("click",e=>{const t=e.target.closest("[data-act],[data-card],[data-do],[data-stk]");if(!t)return;if(t.dataset.act==="start"||t.dataset.act==="retry1")return reset1();if(t.dataset.act==="front")return processFront();if(t.dataset.act==="anti")return playAnti();if(t.dataset.act==="to2"){S.screen="stage2";S.ada=50;S.gob=40;S.adaMax=80;S.gobMax=40;S.stack=[];S.done={};S.goal="play";S.flash="";return render()}if(t.dataset.act==="undo")return undo();if(t.dataset.act==="reboot"){S.screen="boot";return render()}if(t.dataset.card!=null)return clickCard(Number(t.dataset.card));if(t.dataset.do)return perform(t.dataset.do);if(t.dataset.stk!=null)return clickTicket(Number(t.dataset.stk))});
window.addEventListener("keydown",e=>{if((e.key==="z"||e.key==="Z")&&S.screen==="stage2"){e.preventDefault();undo()}});
render();
</script></body></html>
